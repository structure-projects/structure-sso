name: Build and Push to Aliyun

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR (Hangzhou)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # 北京为新增推送渠道，与杭州并存。同一 ACR 账号跨 region 通用，复用同一组 secrets；
      # 两地 tag 由同一次 buildx 构建一起推出，镜像 digest 完全一致。
      - name: Login to Aliyun ACR (Beijing)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push structure-sso Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/yunjida/structure-sso:${{ env.RELEASE_VERSION }}
            registry.cn-hangzhou.aliyuncs.com/yunjida/structure-sso:latest
            registry.cn-beijing.aliyuncs.com/yunjida/structure-sso:${{ env.RELEASE_VERSION }}
            registry.cn-beijing.aliyuncs.com/yunjida/structure-sso:latest

