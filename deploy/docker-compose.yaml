version: "3.8"
services:
  sso:
    image: registry.cn-hangzhou.aliyuncs.com/yunjida/structure-sso:2.0.0
    restart: always
    hostname: sso
    env_file:
      - .env
    deploy:
      restart_policy:
        condition: on-failure
      replicas: 1
    networks:
      - structure-cloud-work
    environment:
      - SCHEME=https
      - SERVER_HOST=api.prod.structured.cn
      - SERVER_PORT=443
    healthcheck:
      test: ["CMD","wget","--spider","-q","http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  structure-cloud-work:
    external: true
